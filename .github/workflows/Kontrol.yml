name: Domain Değişiklik Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */9 * * *'

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      - name : Depo Kontrolü
        uses : actions/checkout@v4
        with :
          repository: "dr-octagon/Cloudstream-BronzeCloud-Source"
          token: ${{ secrets.DIST_REPO_TOKEN }}
          ref: master
          fetch-depth: 0

      - name : Python 3.11.8 Yükle
        uses : actions/setup-python@v5
        with :
          python-version: 3.11.8

      - name : Gereksinimleri Yükle
        run  : |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik cloudscraper pycryptodome curl_cffi

      - name : Betiği Çalıştır
        run  : |
          python KONTROL.py

      - name : Değişiklik Kontrolü
        id   : degisiklik_kontrol
        run  : |
          git diff --quiet . || echo "degisiklik=true" >> $GITHUB_OUTPUT || true

      - name : Değişiklikleri Master Dalına Gönder
        if   : steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        run  : |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --author="Dr.Octagon <41898282+github-actions[bot]@users.noreply.github.com>" \
            -m "♻️ Domain Değişikliği" \
            -m "🔄 Otomatik domain güncellemeleri uygulandı."
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin master && break || sleep 5
          done || echo "Push edilecek degisiklik yok veya push basarisiz"
          if [ -f "domains.json" ]; then
            git clone --depth 1 https://x-access-token:${{ secrets.DIST_REPO_TOKEN }}@github.com/dr-octagon/Cloudstream-BronzeCloud.git -b builds dist_builds || true
            if [ -d "dist_builds" ]; then
              cp domains.json dist_builds/domains.json || true
              cd dist_builds
              git config --local user.name "GitHub Actions"
              git config --local user.email "actions@github.com"
              git add domains.json
              git commit -m "♻️ Auto: domains.json güncellendi." || true
              git pull --rebase origin builds && git push origin builds || true
            fi
          fi